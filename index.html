<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR Distribution Toolkit Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single reading column of four option "plates"; each plate pairs a sitemap tree with flow lanes. Node colours reuse the Kumu diagram's legend. */
:root{
  --bg:#f1f1ef; --surface:#ffffff; --ink:#141414; --muted:#56585e; --line:#d9d9d4; --accent:#5b3fd6;
  --pop:#7de6bd; --pop2:#eef27a; --idfa:#ec6f5f; --on-pop:#141414;
  --format:#2f9e78; --format-bg:#ddf6ec;
  --detail:#7a68d6; --detail-bg:#ebe7fb;
  --venue:#e3604f; --venue-bg:#fde7e3;
  --dist:#c8579f; --dist-bg:#f8e5f1;
  --content:#8a7d1e; --content-bg:#f6f5d3;
  --good:#2f8a5c; --mid:#a06a10; --weak:#b6473a;
  --display:"Martian Mono", "JetBrains Mono", ui-monospace, monospace;
  --body:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1c1c1e; --ink:#ececea; --muted:#a2a3a8; --line:#323236; --accent:#ab98ff;
  --pop:#7de6bd; --pop2:#eef27a; --idfa:#ec6f5f; --on-pop:#141414;
  --format:#5fd3a6; --format-bg:#14302a; --detail:#ab9cf0; --detail-bg:#251f3d;
  --venue:#f2806f; --venue-bg:#3b1f1b; --dist:#e47cc0; --dist-bg:#36192c;
  --content:#d2bf62; --content-bg:#2f2a14; --good:#5cc88f; --mid:#e0a64a; --weak:#ef7f70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1c1c1e; --ink:#ececea; --muted:#a2a3a8; --line:#323236; --accent:#ab98ff;
  --pop:#7de6bd; --pop2:#eef27a; --idfa:#ec6f5f; --on-pop:#141414;
  --format:#5fd3a6; --format-bg:#14302a; --detail:#ab9cf0; --detail-bg:#251f3d;
  --venue:#f2806f; --venue-bg:#3b1f1b; --dist:#e47cc0; --dist-bg:#36192c;
  --content:#d2bf62; --content-bg:#2f2a14; --good:#5cc88f; --mid:#e0a64a; --weak:#ef7f70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;font-stretch:75%}
.wrap{max-width:1080px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:48px}
h1,h2,h3{font-family:var(--display);font-stretch:75%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:600;letter-spacing:-.02em;text-transform:uppercase;line-height:1.02}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:600;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:grid;gap:14px;background:var(--pop);color:var(--on-pop);padding:28px clamp(16px,4vw,36px) 30px;border-radius:4px}
header.top .eyebrow{color:var(--on-pop);opacity:.8}
header.top .pill{justify-self:start;font-family:var(--mono);font-style:italic;font-size:.82rem;border:1.5px solid var(--on-pop);border-radius:999px;padding:3px 14px;background:var(--pop2)}
section>h2{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.lede{font-size:1.12rem;color:var(--muted)}
nav.jump{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:6px;max-width:340px;border-top:1px solid rgba(0,0,0,.35)}
nav.jump a{font-family:var(--mono);font-size:.8rem;text-decoration:none;color:var(--on-pop);border-bottom:1px solid rgba(0,0,0,.35);padding:8px 2px}
nav.jump a:hover{background:var(--pop2)}
nav.jump a:focus-visible{outline-color:var(--on-pop)}

/* Legend / chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:3px 9px;border-radius:6px;border:1px solid transparent;line-height:1.3}
.k-format{background:var(--format-bg);border-color:var(--format)}
.k-detail{background:var(--detail-bg);border-color:var(--detail)}
.k-venue{background:var(--venue-bg);border-color:var(--venue)}
.k-dist{background:var(--dist-bg);border-color:var(--dist)}
.k-content{background:var(--content-bg);border-color:var(--content)}
.k-ui{background:var(--surface);border-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Shared material */
.shared{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.obj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.obj .n{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.obj p{font-size:.92rem;color:var(--muted)}
.obj .chips{display:flex;flex-wrap:wrap;gap:5px}
.obj .chips .chip{font-size:.76rem;padding:2px 7px}

/* Option plate */
section.opt{display:grid;gap:22px;border-top:2px solid var(--ink);padding-top:22px}
.opt-head{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline}
.opt-letter{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:.9;color:var(--accent);grid-row:span 2}
.opt-head .q{font-style:italic;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem}
.meta b{font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}

.block-label{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Sitemap tree */
.tree{overflow-x:auto;padding-bottom:4px}
.tree-root{display:flex;justify-content:flex-start}
.tree-root .node{font-weight:700}
.node{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.92rem}
.node.primary{border-color:var(--ink);border-width:1.5px}
.branches{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(170px,1fr));gap:10px;margin-top:10px;position:relative;padding-top:14px;min-width:calc(var(--cols,4) * 180px)}
.branches::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1.5px solid var(--line)}
.branch{position:relative;display:grid;gap:6px;align-content:start}
.branch::before{content:"";position:absolute;top:-14px;left:16px;height:14px;border-left:1.5px solid var(--line)}
.branch ul{list-style:none;margin:0;padding:0 0 0 12px;border-left:1.5px dashed var(--line);display:grid;gap:4px}
.branch li{font-size:.85rem;color:var(--muted)}
.branch li .chip{font-size:.78rem;color:var(--ink)}
.branch .node.secondary{color:var(--muted);border-style:dashed}

/* Flows */
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.flow h3{font-size:1rem}
.flow .who{font-size:.88rem;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0;align-items:center}
ol.steps li{display:flex;align-items:center}
ol.steps li+li::before{content:"→";color:var(--muted);padding:0 7px;font-family:var(--mono)}
ol.steps li.loop::before{content:"↺";color:var(--accent);font-weight:700}
.note{font-size:.86rem;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{min-width:0}
.pc{display:grid;gap:6px}
.pc ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.plus li::marker{content:"+  ";color:var(--good);font-weight:700}
.minus li::marker{content:"−  ";color:var(--weak);font-weight:700}

/* Screen sketch for option C */
.sketch{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.8rem}
.sk-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sk-bar .tab{padding:2px 8px;border-radius:5px;border:1px solid var(--line);font-family:var(--mono);font-size:.72rem}
.sk-bar .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sk-body{display:grid;grid-template-columns:150px 1fr 180px;min-height:200px}
.sk-body>div{padding:10px;border-right:1px solid var(--line);display:grid;gap:6px;align-content:start;min-width:0}
.sk-body>div:last-child{border-right:0}
.sk-canvas{position:relative;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);opacity:.95}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--venue);border:2px solid var(--surface)}
.dot.big{width:26px;height:26px;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:.66rem}
.stepper{display:flex;align-items:center;gap:6px;overflow-x:auto}
.st{display:flex;align-items:center;gap:6px;flex:none}
.st-c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;border:1.5px solid var(--line)}
.st-l{display:grid;line-height:1.15;font-size:.76rem}
.st-l span{font-size:.66rem;color:var(--muted);font-family:var(--mono)}
.st-line{flex:1;min-width:14px;height:2px;background:var(--line)}
.st-line.done{background:var(--format)}
.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.p-flag{border-color:var(--weak);color:var(--weak)}
.p-rename,.p-merge,.p-split{border-color:var(--mid);color:var(--mid)}
.p-move,.p-add{border-color:var(--accent);color:var(--accent)}
.p-remove,.p-hide{color:var(--muted)}
.src-note{font-size:.78rem;color:var(--muted)}
.combo{display:grid;gap:10px}
.fold{margin:6px 0 4px;padding-left:18px;font-size:.84rem;color:var(--muted)}
.fold li{margin:2px 0}
.combo-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.combo-card{background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.combo-card span:not(.eyebrow){font-size:.86rem;color:var(--muted)}
.combo-card.shared-card{border:1px solid var(--line);background:var(--bg)}
.combo-arrow{text-align:center;font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.wrap{grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
section{grid-template-columns:minmax(0,1fr)}
section>*,.flows>*,.two>*{min-width:0}
.tier-label{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px}
.obj.wide{grid-column:span 2}
@media (max-width:720px){.obj.wide{grid-column:auto}}
.subgrp{display:grid;gap:4px}
.subl{font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.faux{height:8px;border-radius:4px;background:var(--line)}

/* Comparison */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.r{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.r::before{content:"";width:9px;height:9px;border-radius:50%}
.r.s::before{background:var(--good)} .r.m::before{background:var(--mid)} .r.w::before{background:var(--weak)}

.rec{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:22px;display:grid;gap:14px}
.rec ol{margin:0;padding-left:20px;display:grid;gap:6px}
.qs{margin:0;padding-left:20px;display:grid;gap:8px}
footer{font-size:.85rem;color:var(--muted);display:grid;gap:6px}

@media (max-width:720px){
  .two{grid-template-columns:1fr}
  .sk-body{grid-template-columns:1fr}
  .sk-body>div{border-right:0;border-bottom:1px solid var(--line)}
  .sk-canvas{min-height:160px}
  .opt-letter{font-size:2.4rem}
}
@media (prefers-reduced-motion:no-preference){nav.jump a{transition:border-color .15s}}
.rc{display:grid;grid-template-columns:150px 1fr;font-size:.86rem}
.rc>.lab{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 10px 0 12px;border-right:1px dashed var(--line)}
.rc>.lab i{display:block;font-style:normal;font-size:.62rem;text-transform:none;letter-spacing:0;margin-top:2px;opacity:.85}
.rc>.zone{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rc>.zone.last{border-bottom:0}
.rc .nm{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.rc .where{color:var(--muted)}
.rc .act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc .act>div{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;display:grid;gap:3px;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.rc .k{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rc .btn{justify-self:start;border:1px solid var(--ink);border-radius:6px;padding:2px 8px;font-size:.78rem;text-decoration:none;color:var(--ink)}
.rc .star{justify-self:end;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;white-space:nowrap}
.rc .pend{color:var(--muted);font-style:italic}
@media (max-width:600px){.rc{grid-template-columns:1fr}.rc>.lab{border-right:0;padding-bottom:0}.rc .act{grid-template-columns:1fr}}
.cmp{width:100%;border-collapse:collapse;font-size:.84rem;min-width:600px}
.cmp th,.cmp td{padding:7px 12px;border-bottom:0;text-align:left;vertical-align:top}
.cmp thead th{border-top:1px solid var(--line);border-bottom:0;padding-top:10px;background:transparent;text-transform:none;letter-spacing:0;font-family:var(--body);color:var(--ink)}
.cmp thead th b{font-family:var(--display);font-size:1rem;display:block}
.cmp thead th small{color:var(--muted);font-weight:400;display:block}
.cmp tr.grp td{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);padding-top:8px;padding-bottom:6px}
.cmp tr.grp+tr td{padding-top:10px}
.cmp tr.grp td{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cmp tbody tr:not(.grp):has(+tr.grp) td,.cmp tbody tr:last-child td{padding-bottom:12px}
.cmp td:first-child{color:var(--muted);width:20%}
.cmp .yes{color:var(--good);font-weight:600}
.cmp .no{color:var(--muted)}
.cmp .mine{font-size:.74rem;color:var(--muted);display:block}
.cmp tr.score td{font-weight:600;padding-bottom:12px}
.cmp th+th,.cmp td+td{border-left:1px solid var(--line)}
.cmp tr.grp td+td{border-left:0}
.cmp tr.grp.get td{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent)}
.cmp tr.get td b{color:var(--ink)}
.cmp tr.get.end td{border-bottom:2px solid var(--accent)}

.cmp .sub{display:block;font-size:.74rem;color:var(--muted)}
</style>
<style>
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.find{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.find h3{font-size:1rem}
.find p{font-size:.92rem;color:var(--muted)}
.find .src{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.03em}
.find .so{font-size:.9rem;color:var(--ink)}
.find .so::before{content:"So: ";font-weight:700;color:var(--accent)}
.stage-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.stage .tag{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stage p{font-size:.88rem;color:var(--muted)}
.stage.optional{border-style:dashed}
.badge{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);margin-left:8px;vertical-align:middle;white-space:nowrap}
.changed{font-size:.86rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.changed b{color:var(--ink)}
@media (max-width:720px){.stage-row{grid-template-columns:1fr}}
.answers{border-left:3px solid var(--accent);padding:8px 14px;background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem}
.answers .eyebrow{display:block;margin-bottom:2px}
.sk-body.atlas{grid-template-columns:230px 1fr 170px}
.frow{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:.72rem}
.frow .h{color:var(--muted);cursor:grab}
.frow .rk{font-family:var(--mono);color:var(--accent)}
.frow .fl{display:grid;line-height:1.25;min-width:0}
.frow .fl b{font-weight:600}
.frow .tg{font-family:var(--mono);font-size:.62rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.frow .tg.must{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.frow.drag{transform:rotate(-1.5deg) translateX(6px);box-shadow:0 4px 10px rgba(0,0,0,.18);border-color:var(--accent)}
.drop-gap{height:6px;border:1px dashed var(--accent);border-radius:6px}
@media (max-width:720px){.sk-body.atlas{grid-template-columns:1fr}}
.sk-canvas.globe{background:none;padding:22px 6px 30px;display:grid;place-items:center}
.sk-canvas.globe svg{max-width:420px}
.globe-toggle{position:absolute;top:8px;right:8px;display:flex;font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.globe-toggle span{padding:2px 8px}
.globe-toggle .on{background:var(--ink);color:var(--bg)}
.globe-legend{position:absolute;right:8px;bottom:8px;display:grid;gap:2px;font-size:.66rem;color:var(--muted);background:var(--surface);padding:4px 6px;border-radius:6px;border:1px solid var(--line)}
.globe-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--venue);margin-right:5px;vertical-align:middle}
.globe-legend i.f{opacity:.35}
.globe-legend i.l{width:14px;height:0;border-radius:0;border-top:1.5px dashed var(--accent);background:none}
.sk-results{border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.74rem}
.sk-results .res{border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--bg)}
.sk-results .res b{font-family:var(--mono);color:var(--accent);margin-right:4px}
.ans{display:grid;gap:6px}
.ans-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1.5px solid var(--muted);border-radius:8px;background:var(--surface);font-size:.8rem;cursor:pointer}
.ans-btn::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.ans-btn.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-weight:600}
.ans-btn.sel::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:.66rem;width:max-content;max-width:100%}
.seg span{padding:3px 7px;border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}
.seg .on{background:var(--ink);color:var(--bg)}
.q-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.btn-primary{background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 10px;font-size:.74rem;font-weight:600}
.case-ref{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;font-size:.74rem;color:var(--muted);display:grid;gap:2px}
.case-ref a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.sk-body.live{grid-template-columns:150px 1fr 200px}
.sk-acc{display:grid;gap:6px;padding:12px;background:var(--bg)}
.acc{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.acc.optional{border-style:dashed}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:.84rem;flex-wrap:wrap}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"▸";margin-left:auto;color:var(--muted);font-family:var(--mono)}
.acc[open]>summary::after{content:"▾"}
.acc-n{font-family:var(--mono);font-size:.68rem;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--ink);flex:none}
.acc.done .acc-n{background:var(--ink);color:var(--bg)}
.acc.optional .acc-n{border-style:dashed;color:var(--muted)}
.acc-pick{color:var(--muted);font-size:.76rem}
.acc-opts{display:grid;gap:5px;padding:2px 10px 10px 38px}
.acc.sub{border-color:var(--line);background:var(--bg)}
.acc.sub>summary{font-size:.8rem;padding:6px 8px}
.acc.sub .acc-opts{padding:2px 8px 8px 14px}
.acc-hint{font-size:.72rem;color:var(--muted)}
.cbx{display:flex;align-items:center;gap:8px;font-size:.8rem}
.cbx i{width:13px;height:13px;border:1.5px solid var(--ink);border-radius:3px;flex:none}
.cbx.on i{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
@media (max-width:720px){.acc-opts{padding-left:14px}}
.live-n{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;color:var(--ink)}
.funnel{display:grid;gap:3px;font-size:.68rem;color:var(--muted)}
.funnel div{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:center}
.funnel i{display:block;height:6px;border-radius:3px;background:var(--venue);opacity:.35}
.funnel .cur i{opacity:1}
.funnel .cur{color:var(--ink);font-weight:600}
.vlist{display:grid;gap:4px;font-size:.74rem}
.vlist span{border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg)}
.sk-consider{border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:.78rem}
@media (max-width:720px){.sk-body.live{grid-template-columns:1fr}}
</style>

/* Journey prototype additions: answer kind, requirement rows, empty state */
.sk-kind{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sk-kind i{width:9px;height:9px;border-radius:50%;flex:none}
.sk-dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sk-think{font-size:.76rem;font-style:italic;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px}
.sk-needs{display:grid;gap:0}
.sk-need{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:6px 10px;align-items:center;font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--line)}
.sk-need:last-child{border-bottom:0}
.sk-need .cbx{font-size:.7rem;color:var(--muted)}
.sk-empty{font-size:.78rem;color:var(--muted);display:grid;gap:4px}
.sk-brief .sk-plan-items li{border-radius:3px;padding:0 3px;margin-left:-3px}
.sk-brief .sk-plan-items li.sk-new{background:color-mix(in srgb,var(--accent) 16%,transparent);animation:sk-flash 2s ease-out forwards}
@keyframes sk-flash{0%,40%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.sk-brief .sk-plan-items li.sk-new{animation:none}}
.sk-plan-empty{font-size:.7rem;color:var(--muted)}
/* Brief panel: fixed to the height of the question column, scrolls inside */
.sk-body>.sk-brief{display:flex;flex-direction:column;padding:0;gap:0;contain:size;min-height:440px;overflow:hidden}
.sk-brief-scroll{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px;display:grid;gap:4px;align-content:start}
.sk-brief-foot{border-top:1px solid var(--line);padding:8px 10px 10px;display:grid;gap:4px}
.sk-sec{border-bottom:1px solid var(--line);padding:4px 0}
.sk-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);padding:2px 0}
.sk-sec>summary::-webkit-details-marker{display:none}
.sk-sec>summary::before{content:"▸";font-family:var(--mono);font-size:.62rem;width:8px}
.sk-sec[open]>summary::before{content:"▾"}
.sk-sec .sk-n{margin-left:auto;font-family:var(--mono);font-size:.64rem}
.sk-sec>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sk-sec .sk-plan-items{margin:2px 0 4px}
@media (max-width:720px){.sk-body>.sk-brief{contain:none;min-height:0}.sk-brief-scroll{flex:none;max-height:300px}}
.sk-empty b{color:var(--ink)}
/* Journey plan stage: full width */
.sk-body.sk-full{grid-template-columns:minmax(0,1fr)}
.sk-plan-full{white-space:pre-wrap;font-family:var(--mono);font-size:.76rem;line-height:1.6;margin:4px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:720px){.sk-need{grid-template-columns:1fr}}
.sk-rm{font-size:1rem;line-height:1;color:var(--muted);padding:2px 6px;border-radius:4px;align-self:start}
.sk-rm:hover,.sk-rm:focus-visible{color:var(--venue)}
/* Section starter page */
.sk-intro{display:grid;gap:12px;max-width:60ch}
.sk-intro h3{margin:0;font-size:1.3rem;line-height:1.25}
.sk-intro p{margin:0;font-size:.88rem;line-height:1.55}
.sk-intro-in{display:grid;gap:6px}
.sk-intro-in>small,.sk-intro-out b{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;display:block;margin-bottom:2px}
.sk-intro-in ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sk-intro-in li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.84rem}
.sk-intro-in li small{font-size:.7rem;color:var(--muted)}
.sk-intro-out{color:var(--muted)}
.sk-kind b{font-weight:700;color:var(--ink)}
.sk-kind{text-transform:none;letter-spacing:0;font-family:inherit;font-size:.72rem}
/* Structured brief: one row per question, grouped by purpose */
.sk-sec>summary .sk-dot{width:7px;height:7px}
.sk-brows{margin:4px 0 6px;display:grid;gap:6px}
.sk-brows>div{display:grid;gap:1px;padding:2px 4px;margin-left:-4px;border-radius:3px}
.sk-brows dt{font-size:.62rem;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sk-brows dd{margin:0;font-size:.74rem;line-height:1.35}
.sk-brows dd .pl-tag{font-size:.56rem;padding:0 5px}
.sk-brows>div.sk-new{background:color-mix(in srgb,var(--accent) 16%,transparent);animation:sk-flash 2s ease-out forwards}
@media (prefers-reduced-motion:reduce){.sk-brows>div.sk-new{animation:none}}
.sk-note.sk-write{min-height:180px;font-size:.92rem;line-height:1.6;padding:14px 16px;background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.sketch.live-sk .sk-navl{justify-self:start;margin-top:6px;font-size:.74rem;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:0}
.sk-body b .req{color:var(--venue);font-weight:700}

/* App shell: one top bar with two tabs (distribution plan, database); the screens fill the width below */
[hidden]{display:none!important}
.app{max-width:1320px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.app-top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-stretch:75%;font-weight:600;font-size:1.05rem;letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-transform:uppercase}
.app-tabs{display:flex;margin-left:auto;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.app-tabs button{font:inherit;display:grid;gap:1px;text-align:left;line-height:1.2;padding:6px 14px;background:none;color:var(--ink);border:0;cursor:pointer}
.app-tabs button+button{border-left:1.5px solid var(--ink)}
.app-tabs button span{font-size:.86rem;font-weight:600}
.app-tabs small{font-family:var(--mono);font-size:.64rem;color:var(--muted)}
.app-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.app-tabs button[aria-selected="true"] small{color:var(--bg);opacity:.75}
.app-tabs button:hover:not([aria-selected="true"]){background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.app-tabs button:focus-visible,.logo:focus-visible,.home button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-main{display:grid;min-width:0}
.app-foot{font-size:.74rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (max-width:640px){.app-tabs{margin-left:0;width:100%}.app-tabs button{flex:1}}


/* Landing: one screen, the headline and the two ways in, on a plain background (Jacie 2026-11-02: no starry sky; a new visual direction is coming) */
.home{text-align:center;min-height:calc(100vh - 90px);display:grid;place-content:center;justify-items:center;gap:36px;padding-block:24px 56px}
.home h1{font-size:clamp(2.1rem,6vw,4.2rem);text-transform:none;letter-spacing:-.02em;max-width:15ch;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ways{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px;max-width:calc(100vw - 32px)}
.btn-primary.big{border:1.5px solid transparent;cursor:pointer;font-family:var(--display);font-stretch:75%;font-weight:600;font-size:clamp(1rem,1.6vw,1.15rem);padding:14px 24px;border-radius:8px;white-space:nowrap;max-width:100%;min-width:min(290px,100%)}
.home .btn-primary.big{background:var(--ink);color:var(--bg)}
.home .btn-primary.big.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.home .btn-primary.big:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.home .btn-primary.big.alt:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.home button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:640px){.ways{flex-direction:column;align-items:stretch;width:100%}.btn-primary.big{white-space:normal}}

/* Screens at full width */
.app .sketch{font-size:.84rem}
#sk-journey .sk-body{grid-template-columns:210px minmax(0,1fr) 270px}
#sk-journey .sk-body.circ{grid-template-columns:210px minmax(0,1fr) 330px}
#sk-journey .sk-body.sk-full{grid-template-columns:minmax(0,1fr)}
#sk-pathway .sk-body.live{grid-template-columns:200px minmax(0,1fr) 300px}
#sk-journey .sk-body>div:nth-child(2){padding:16px 20px}
/* Narrow screens: side panels fold into rails and open as drawers over the middle */
.rz-rail{display:none}
@media (max-width:1100px){
  .sketch .sk-body.rz{position:relative;padding-left:34px;min-height:480px}
  #sk-journey .sk-body.rz{grid-template-columns:minmax(0,1fr) 270px}
  #sk-journey .sk-body.rz.circ{grid-template-columns:minmax(0,1fr) 300px}
  #sk-pathway .sk-body.rz{grid-template-columns:minmax(0,1fr) 280px}
  .sk-body.rz>div:first-child{display:none}
  .rz-l .sk-body.rz>div:first-child{display:flex;flex-direction:column;position:absolute;z-index:6;left:34px;top:0;bottom:0;width:min(260px,calc(100% - 34px));overflow:auto;background:var(--bg);border-right:1px solid var(--line);box-shadow:8px 0 24px -12px rgba(0,0,0,.25)}
  .rz-rail{display:flex;flex-direction:column;align-items:center;gap:8px;position:absolute;top:0;bottom:0;width:34px;padding:12px 0;background:var(--bg);color:var(--muted);font-size:.78rem;letter-spacing:.02em;cursor:pointer;z-index:5}
  .rz-rail:hover,.rz-rail[aria-expanded="true"]{color:var(--ink)}
  .rz-rail.l{left:0;border-right:1px solid var(--line)}
  .rz-rail.r{display:none;right:0;border-left:1px solid var(--line)}
  .rz-lbl{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  .rz-arr{font-size:1rem;line-height:1}
}
@media (max-width:760px){

.sk-kind i.k-find{background:var(--ph)}

.jm .ans{max-width:560px;grid-template-columns:minmax(0,1fr)}

.jm .sk-intro h3{font-size:1.5rem}

/* What's essential: a ranked list. Drag to reorder, or use the arrow buttons */

.rk-li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 10px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;cursor:grab}

.ans-own{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}

/* Database diagram: circles coloured by layer, the selected one glows like a node of light (Jacie 2026-11-02) */
:root{--pw-loc:#3b7ea1;--pw-disc:#b8892c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pw-loc:#74b6d8;--pw-disc:#dcb45e}}
:root[data-theme="dark"]{--pw-loc:#74b6d8;--pw-disc:#dcb45e}
.pw-halo{opacity:.75;transform-box:fill-box;transform-origin:center;animation:pw-breathe 3.4s ease-in-out infinite}
.pw-core{fill:#fff;opacity:.75}
@keyframes pw-breathe{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:.95;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.pw-halo{animation:none}}
/* Question options: no box around each option; the circle fills and glows in the journey colour when chosen (Jacie 2026-11-02) */
#sk-journey .jm .ans-btn{border:0;background:transparent;border-radius:8px;padding:7px 8px;font-weight:400;gap:12px}
#sk-journey .jm .ans-btn:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
#sk-journey .jm .ans-btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#sk-journey .jm .ans-btn::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 40%,transparent);background:transparent;box-shadow:none;transition:background .25s,box-shadow .25s,border-color .25s}
#sk-journey .jm .ans-btn.sel{background:transparent;font-weight:600}
#sk-journey .jm .ans-btn.sel:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
#sk-journey .jm .ans-btn.sel::before{border-color:var(--glow,var(--ink));background:radial-gradient(circle,#fff 0 22%,var(--glow,var(--ink)) 62%);box-shadow:0 0 5px 1px var(--glow,var(--ink)),0 0 14px 4px color-mix(in srgb,var(--glow,var(--ink)) 50%,transparent)}
#sk-journey .jm .ans-btn.ans-flex::before{border-style:dashed}
/* Next: a round arrow button */
.sketch.live-sk .jm .q-actions .btn-primary.q-next{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;line-height:1;background:var(--ink);color:var(--bg)}
.sketch.live-sk .jm .q-actions .btn-primary.q-next:hover{background:color-mix(in srgb,var(--ink) 82%,var(--bg))}
.sketch.live-sk .jm .q-actions .btn-primary.q-next:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* Database bar: "Start from" + Clear all on line one, the filters on line two */
#sk-pathway .sk-bar .pw-br{flex-basis:100%;height:0}
#sk-pathway .sk-bar{row-gap:5px}
/* Fonts (Jacie 2026-11-02): Recia for titles, Space Grotesk for body text */
:root{--display:"Recia",Georgia,serif;--body:"Space Grotesk","Segoe UI",system-ui,sans-serif}
.sketch.live-sk .rz-rail{font-size:.78rem}
.btn-primary.big{font-family:var(--body);font-stretch:100%;font-weight:500}
/* Question text in the journey colour, with a thin journey-colour bar along the top of the question area (Jacie 2026-11-02) */
#sk-journey .jm .q-t{color:var(--qc,var(--ink))}
#sk-journey .sk-body>div.jm{border-top:3px solid var(--glow,transparent)}

/* ===== Design system: "Nodes of Light in the app pages: a quiet plan" (2026-11-02) =====
   Light mode only (the page carries data-theme="light"); a subtle static paper grain on every page;
   actions are an underline or a round button; glow only on selected things and the Next button (hover, press). */
:root{color-scheme:light}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2147483000;background-image:var(--grain);background-size:160px 160px;opacity:.5}

/* Top tabs: plain words, the active one underlined (2px) */
.app-tabs{border:0;border-radius:0;background:none;gap:24px;overflow:visible}
.app-tabs button{padding:6px 0;color:var(--muted)}
.app-tabs button+button{border-left:0}
.app-tabs button[aria-selected="true"]{background:none;color:var(--ink)}
.app-tabs button[aria-selected="true"]>span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px}
.app-tabs button:hover:not([aria-selected="true"]){background:none;color:var(--ink)}
@media (max-width:640px){.app-tabs{gap:12px}.app-tabs button{text-align:center;justify-items:center}}

/* Landing: the two ways in are underlined words, as on the Nodes of Light landing */
.ways{gap:14px 44px}
.home .btn-primary.big,.home .btn-primary.big.alt{background:none;border:0;border-radius:0;color:var(--ink);padding:6px 2px;min-width:0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:9px}
.home .btn-primary.big:hover,.home .btn-primary.big.alt:hover{background:none;text-decoration-thickness:3px}
@media (max-width:640px){.ways{align-items:center}}

/* Start page: an accent dot per journey, plain cards, and a round arrow (filled for Planning, a line for the others) */
.sketch.live-sk .jc-card,.sketch.live-sk .jc-card.first{align-items:center;background:var(--surface);border-color:var(--line)}
.sketch.live-sk .jc-card:hover,.sketch.live-sk .jc-card.first:hover{background:var(--surface);border-color:var(--ink)}
.jc-card b,.jc-card.first b{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}
.jc-card span:not(.jc-dot),.jc-card.first span:not(.jc-dot){color:var(--muted)}
.jc-card .jc-dot{width:10px;height:10px;border-radius:50%;background:var(--ph);flex:none}
.jc-card i,.jc-card.first i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ph);color:var(--ph);font-size:.95rem}
.jc-card.first i{background:var(--ph);color:#fff}

/* Progress: the rings carry no check marks */
.sn-ck{display:none}

/* Small actions are underlined words */
.sketch.live-sk .sk-back{color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.sketch.live-sk .sk-back:hover{color:var(--ink)}
.sketch.live-sk .rk-add .sk-mini{border:0;border-radius:0;padding:0 4px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.sketch.live-sk button.chip.k-ui{border:0!important;background:none;padding:2px 0;border-radius:0;text-decoration:underline;text-underline-offset:3px}
.sketch.live-sk .sk-bar button.tab{border-color:transparent!important;background:none;color:var(--ink)!important;padding:2px 2px;text-decoration:underline;text-underline-offset:4px}
.sketch.live-sk .sn-plan{border:0;border-radius:0;padding:5px 2px}
.sketch.live-sk .sn-plan:not(.cur):hover{border-color:transparent}
.sketch.live-sk .sn-plan.cur{background:none;color:var(--ink)}
.sketch.live-sk .sn-plan.cur span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
@media (max-width:640px){.sketch.live-sk .sn-plan.cur{box-shadow:inset 0 -2px 0 var(--ink)}}
.sketch.live-sk .pl-acts .btn-primary{background:none;color:var(--ink);border:0;border-radius:0;padding:4px 2px;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.sketch.live-sk .pl-acts .btn-primary:hover{text-decoration-thickness:3px}
.sketch.live-sk .pl-ghost{border:0;border-radius:0;padding:4px 2px;text-decoration:underline;text-underline-offset:6px}

/* Your Plan: plain sections, the phase accent only on each section's dot */
.pl-part .pl-sec-h::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ph);margin-right:12px;vertical-align:.12em}

/* Round Next: always in the phase accent; a line until the question is answered, then filled; glows on hover and press */
.sketch.live-sk .jm .q-actions .btn-primary.q-next{background:transparent;color:var(--glow,var(--ink));border:1.5px solid var(--glow,var(--ink));transition:background .3s,color .3s,box-shadow .35s}
.sketch.live-sk .jm .q-actions .btn-primary.q-next.on{background:var(--glow,var(--ink));color:#fff}
.sketch.live-sk .jm .q-actions .btn-primary.q-next:hover{background:transparent}
.sketch.live-sk .jm .q-actions .btn-primary.q-next.on:hover{background:var(--glow,var(--ink))}
.sketch.live-sk .jm .q-actions .btn-primary.q-next:hover,.sketch.live-sk .jm .q-actions .btn-primary.q-next:active{box-shadow:0 0 0 4px color-mix(in srgb,var(--glow,var(--ink)) 14%,transparent),0 0 18px 4px color-mix(in srgb,var(--glow,var(--ink)) 45%,transparent)}

/* Glow only on selected things: options fade their glow in; Database nodes fade in once and then stay still */
#sk-journey .jm .ans-btn::before{transition:background .4s,box-shadow .4s,border-color .4s}
.pw-halo{animation:none;opacity:.8}
.pw-halo.pw-new{animation:pw-in .6s ease-out both}
@keyframes pw-in{from{opacity:0;transform:scale(.6)}to{opacity:.8;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pw-halo.pw-new,.sketch.live-sk .jm .q-actions .btn-primary.q-next,#sk-journey .jm .ans-btn::before{animation:none;transition:none}}

/* Nodes of light, as on the landing (Jacie 2026-11-02): a chosen option is a small pale bright centre in the journey colour,
   fading out through a wide soft halo, with no ring; a newly chosen one flares once and settles */
#sk-journey .jm .ans-btn.sel::before{border-color:transparent;background:radial-gradient(circle,#fff 0,color-mix(in srgb,var(--glow,var(--ink)) 35%,#fff) 1.8px,color-mix(in srgb,var(--glow,var(--ink)) 80%,#fff) 3.4px,var(--glow,var(--ink)) 4.4px,color-mix(in srgb,var(--glow,var(--ink)) 55%,transparent) 5.6px,transparent 7px);box-shadow:0 0 7px 3px color-mix(in srgb,var(--glow,var(--ink)) 40%,transparent),0 0 24px 10px color-mix(in srgb,var(--glow,var(--ink)) 16%,transparent)}
#sk-journey .jm .ans-btn.sel.lit::before{animation:node-flare 1.1s ease-out both}
@keyframes node-flare{0%{transform:scale(.4);box-shadow:0 0 0 0 transparent,0 0 0 0 transparent}35%{transform:scale(1.25);box-shadow:0 0 12px 4px color-mix(in srgb,var(--glow,var(--ink)) 55%,transparent),0 0 34px 14px color-mix(in srgb,var(--glow,var(--ink)) 22%,transparent)}100%{transform:scale(1)}}
.pw-halo.pw-new{animation:pw-flare 1.1s ease-out both}
@keyframes pw-flare{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pw-halo{opacity:1}
/* Progress links: thin wandering roots with short offshoots */
.sn-line{flex:1 1 0;min-width:14px;height:24px;background:none;overflow:visible}
.sn-root{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.75}
.sn-tend{fill:none;stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.45}
.sketch.live-sk .sn-plan span{display:inline}
@media (max-width:640px){.sn-line{margin-top:5px;min-width:8px;height:24px}.sketch.live-sk .sn-plan{font-size:.74rem;padding:8px 2px;margin-top:0}}
@media (prefers-reduced-motion:reduce){#sk-journey .jm .ans-btn.sel.lit::before,.pw-halo.pw-new{animation:none}}
/* One sans serif (Jacie 2026-11-02): the small labels and counts use Space Grotesk too, no mono font */
:root{--mono:"Space Grotesk","Segoe UI",system-ui,sans-serif}

/* Options as nodes, like the landing (Jacie 2026-11-03): an unchosen option is a small dim disc; a chosen one is a slightly larger
   flat disc in the journey colour inside a wide, faint, soft halo. "Flexible" keeps a dashed outline. */
#sk-journey .jm .ans-btn::before{width:10px;height:10px;margin:0 2px;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);box-shadow:none}
#sk-journey .jm .ans-btn:hover::before{background:color-mix(in srgb,var(--ink) 38%,transparent)}
#sk-journey .jm .ans-btn.ans-flex::before{background:transparent;border:1.5px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
#sk-journey .jm .ans-btn.sel::before{width:12px;height:12px;margin:0 1px;border:0;background:color-mix(in srgb,var(--glow,var(--ink)) 88%,#fff);box-shadow:0 0 6px 2px color-mix(in srgb,var(--glow,var(--ink)) 32%,transparent),0 0 24px 10px color-mix(in srgb,var(--glow,var(--ink)) 15%,transparent)}
@keyframes node-flare{0%{transform:scale(.5);box-shadow:0 0 0 0 transparent,0 0 0 0 transparent}35%{transform:scale(1.2);box-shadow:0 0 10px 4px color-mix(in srgb,var(--glow,var(--ink)) 45%,transparent),0 0 36px 16px color-mix(in srgb,var(--glow,var(--ink)) 20%,transparent)}100%{transform:scale(1)}}
/* Small labels in Recia (Jacie 2026-11-03): the uppercase group, section and field labels, e.g. "Audience and impact" */
.jl-g,.pl-fact small,.pl-a dt,.pl-how small,.pl-review small,.pl-why dt,.bf-g dt,.res-rel small,.eyebrow,.meta b,.block-label,.tier-label,thead th,.rc>.lab,.rc .k,.cmp tr.grp td,.stage .tag{font-family:var(--display);font-weight:600;letter-spacing:.06em}
.jl-g{font-size:.66rem}
/* Back links without an underline (Jacie 2026-11-03) */
.sketch.live-sk .sk-back,.sketch.live-sk .sk-back:hover,.sketch.live-sk .sk-mini[data-sk="pw-sup"],.sketch.live-sk .sk-mini[data-sk="pw-sup"]:hover{text-decoration:none}
.sketch.live-sk .sk-mini[data-sk="pw-sup"]:hover{color:var(--ink)}
/* Journey start page (Jacie 2026-11-03): no frame around each journey, the round arrow is enough; on hover the line arrow fills */
.sketch.live-sk .jc-card,.sketch.live-sk .jc-card.first,.sketch.live-sk .jc-card:hover,.sketch.live-sk .jc-card.first:hover{border-color:transparent;background:none}
.sketch.live-sk .jc-card i{transition:background-color .2s,color .2s}
.sketch.live-sk .jc-card:hover i{background:var(--ph);color:#fff}
.sketch.live-sk .jc-card.first:hover i{background:color-mix(in srgb,var(--ph) 82%,var(--ink))}
/* Database without the "Your path" column (Jacie 2026-11-03): the diagram, then the matching venues */
#sk-pathway .sk-body.live{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:1100px){
  #sk-pathway .sk-body.rz.nol{padding-left:0;grid-template-columns:minmax(0,1fr) 280px}
  #sk-pathway .sk-body.rz.nol>div:first-child{display:grid}
}
@media (max-width:760px){
  #sk-pathway .sk-body.rz.nol{grid-template-columns:minmax(0,1fr);padding-right:34px}
  #sk-pathway .sk-body.rz.nol>div:nth-child(2){display:none}
  #sk-pathway.rz-r .sk-body.rz.nol>div:nth-child(2){display:flex;flex-direction:column;position:absolute;z-index:6;right:34px;top:0;bottom:0;width:min(320px,calc(100% - 34px));overflow:auto;background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px -12px rgba(0,0,0,.25)}
}
/* Journey start page (Jacie 2026-11-03): the journey name is underlined, and glows in its colour on hover */
.jc-card b .jc-name{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-color:var(--ph);transition:text-shadow .25s}
.sketch.live-sk .jc-card:hover b .jc-name,.sketch.live-sk .jc-card:focus-visible b .jc-name{text-shadow:0 0 14px color-mix(in srgb,var(--ph) 55%,transparent),0 0 3px color-mix(in srgb,var(--ph) 30%,transparent)}
.sketch.live-sk .jc-card .jc-dot{transition:box-shadow .25s}
.sketch.live-sk .jc-card:hover .jc-dot,.sketch.live-sk .jc-card:focus-visible .jc-dot{box-shadow:0 0 6px 2px color-mix(in srgb,var(--ph) 40%,transparent),0 0 18px 6px color-mix(in srgb,var(--ph) 18%,transparent)}
.sketch.live-sk .jc-card b .jc-name{font-size:inherit;color:var(--ink)}
/* Hover in the questionnaire (Jacie 2026-11-03): the text turns the journey colour, no grey backdrop */
.sketch.live-sk .jl-q:hover{background:none;color:var(--ph-tx,var(--ink))}
#sk-journey .jm .ans-btn:hover,#sk-journey .jm .ans-btn.sel:hover{background:none;color:var(--qc,var(--ink))}
#sk-journey .jm .ans-btn{transition:color .15s}
.sketch.live-sk .jl-q{transition:color .15s}
/* Start pages (Jacie 2026-11-03): as with the landing's action links, the underline rests short and expands on hover,
   while the text takes the colour and a soft glow */
.jc-card b .jc-name{position:relative;text-decoration:none;padding-bottom:5px;transition:color .3s,text-shadow .3s}
.jc-card b .jc-name::after,.pw-starts .pw-name::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--ph);transform:scaleX(.35);transition:transform .4s cubic-bezier(.3,1.2,.5,1)}
.sketch.live-sk .jc-card:hover b .jc-name,.sketch.live-sk .jc-card:focus-visible b .jc-name{color:var(--ph-tx,var(--ink));text-shadow:0 0 10px color-mix(in srgb,var(--ph) 35%,transparent)}
.sketch.live-sk .jc-card:hover b .jc-name::after,.sketch.live-sk .jc-card:focus-visible b .jc-name::after,.sketch.live-sk .pw-starts .fork-opt:hover .pw-name::after,.sketch.live-sk .pw-starts .fork-opt:focus-visible .pw-name::after{transform:scaleX(1)}
/* Database start page: the same rows as the journey start page, with no boxes, in the Database accent */
.pw-starts{grid-template-columns:minmax(0,1fr);max-width:560px;gap:10px}
@media (max-width:720px){.pw-starts{grid-template-columns:minmax(0,1fr)}}
.sketch.live-sk .pw-starts .fork-opt,.sketch.live-sk .pw-starts .fork-opt:hover{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:14px 20px;border:0;border-radius:10px;background:none}
.sketch.live-sk .pw-starts .fork-opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pw-starts .fork-opt b{grid-column:1;font-family:var(--display);font-stretch:75%;font-size:1.1rem;font-weight:600;color:var(--ink)}
.pw-starts .fork-opt>span{grid-column:1;font-size:.84rem;color:var(--muted)}
.sketch.live-sk .pw-starts .pw-name{display:inline-block;position:relative;padding-bottom:5px;font-size:inherit;color:inherit;transition:color .3s,text-shadow .3s}
.pw-starts .pw-name::after{background:var(--accent)}
.sketch.live-sk .pw-starts .fork-opt:hover .pw-name,.sketch.live-sk .pw-starts .fork-opt:focus-visible .pw-name{color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.pw-starts .fork-opt i{grid-column:2;grid-row:1/3;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-style:normal;font-size:.95rem;transition:background-color .2s,color .2s}
.sketch.live-sk .pw-starts .fork-opt:hover i{background:var(--accent);color:#fff}
/* Phones: the longer Database questions wrap, so each line gets its own full underline instead of the expanding bar */
@media (max-width:560px){
  .sketch.live-sk .pw-starts .fork-opt,.sketch.live-sk .pw-starts .fork-opt:hover{padding:12px 4px}
  .sketch.live-sk .pw-starts .pw-name{display:inline;padding-bottom:0;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
  .pw-starts .pw-name::after{display:none}
}
/* Start pages (Jacie 2026-11-03, v67): the whole name is underlined; on hover it glows and its short description appears below.
   Phones have no hover, so there the descriptions always show. */
.jc-card b .jc-name::after,.pw-starts .pw-name::after{display:none}
.sketch.live-sk .jc-card b .jc-name{padding-bottom:0;text-decoration:underline;text-decoration-color:var(--ph);text-decoration-thickness:2px;text-underline-offset:7px}
.sketch.live-sk .pw-starts .pw-name{display:inline;padding-bottom:0;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:7px}
.sketch.live-sk .jc-card:hover b .jc-name,.sketch.live-sk .jc-card:focus-visible b .jc-name{text-shadow:0 0 12px color-mix(in srgb,var(--ph) 45%,transparent)}
.sketch.live-sk .pw-starts .fork-opt:hover .pw-name,.sketch.live-sk .pw-starts .fork-opt:focus-visible .pw-name{text-shadow:0 0 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.sketch.live-sk .jc-card,.sketch.live-sk .jc-card.first{grid-template-columns:minmax(0,1fr) auto;align-items:center;row-gap:8px}
.jc-card b{grid-column:1;grid-row:1}
.jc-card>span{grid-column:1;grid-row:2;padding-left:20px}
.jc-card i{grid-column:2;grid-row:1/3}
.jc-card>span,.pw-starts .fork-opt>span{opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.sketch.live-sk .jc-card:hover>span,.sketch.live-sk .jc-card:focus-visible>span,.sketch.live-sk .pw-starts .fork-opt:hover>span,.sketch.live-sk .pw-starts .fork-opt:focus-visible>span{opacity:1;transform:none}
.pw-starts .fork-opt b{margin-bottom:4px}
@media (hover:none){.jc-card>span,.pw-starts .fork-opt>span{opacity:1;transform:none}}
/* Question list (Jacie 2026-11-03): the questions sit one indent in from their small group label */
.sketch.live-sk .jl-g~.jl-q{padding-left:25px}
/* Options (Jacie 2026-11-03): an unchosen option is a hollow ring again (dashed for Flexible); a chosen one stays the glowing disc */
#sk-journey .jm .ans-btn::before{box-sizing:border-box;width:13px;height:13px;margin:0 1px;background:transparent;border:1.5px solid color-mix(in srgb,var(--ink) 40%,transparent)}
#sk-journey .jm .ans-btn:not(.sel):hover::before{background:transparent;border-color:var(--glow,var(--ink))}
#sk-journey .jm .ans-btn.ans-flex:not(.sel)::before{border-style:dashed}
#sk-journey .jm .ans-btn.sel::before{width:13px;height:13px;border:0}
/* Database start page: a dot before each starting point, as on the journey start page */
.pw-starts .fork-opt b{display:inline-flex;align-items:flex-start;gap:10px}
.pw-starts .fork-opt .jc-dot{flex:none;width:10px;height:10px;margin-top:calc(.75em - 5px);border-radius:50%;background:var(--accent);transition:box-shadow .25s}

    'j-ans':t=>{ const k=t.dataset.key, a=A(k), v=t.dataset.val; j.lit=k+':'+v;

      if(k==='fmt'){ const ok=subOpts(); A('fdet').v=A('fdet').v.filter(x=>ok[x]); }
      j.changed=k; render(); refocus(v==='other'&&a.v.includes('other')?`#sk-o-${k}`:`[data-sk="j-ans"][data-key="${k}"][data-val="${v}"]`); },
    'j-move':t=>{ const k=t.dataset.k, d=+t.dataset.d; moveRk(k,d); render(); const b=jEl.querySelector(`[data-sk="j-move"][data-k="${k}"][data-d="${d}"]`); (b&&!b.disabled?b:jEl.querySelector(`[data-sk="j-move"][data-k="${k}"]:not([disabled])`))?.focus(); },
    'j-rkok':()=>{ A('ess').set=true; render(); refocus('.rk-li [data-sk="j-move"]:not([disabled])'); },
    // Every element can be removed (Jacie 2026-11-02); removed listed ones can be brought back at the end of the list
    'j-rkback':()=>{ const a=A('ess'), q=qOf('ess').q; a.order=[...a.order,...Object.keys(q.items).filter(k=>!a.order.includes(k))]; j.rkMsg='Removed elements brought back'; render(); refocus('#sk-add-ess'); },
    'j-add':t=>addOwn(t.dataset.key),
    'j-del':t=>delOwn(t.dataset.key,t.dataset.k),
    'j-flex':t=>{ const k=t.dataset.key; A(k).v=['flex']; if(k==='fmt') A('fdet').v=[]; render(); },
    'j-reset':t=>{ MQ[t.dataset.mode].forEach(([k])=>{ A(k).v=[]; }); render(); },
    'j-blank':()=>{ bridge.reset(); },
    'j-tick':t=>{ const id=t.dataset.id; j.lit=id; j.tick.has(id)?j.tick.delete(id):j.tick.add(id); render(); refocus(`[data-sk="j-tick"][data-id="${id}"]`); },
    'j-chk':()=>{ j.showChk=!j.showChk; render(); },
    'j-more':()=>{ j.more+=6; render(); },
    'j-hide':t=>{ j.hide.add(t.dataset.id); stars.delete(t.dataset.id); rerenderAll(); },
    'j-unhide':()=>{ j.hide.clear(); rerenderAll(); },
    'j-open':t=>{ j.open=j.open===t.dataset.id?null:t.dataset.id; render(); refocus(`[data-sk="j-open"][data-id="${t.dataset.id}"]`); },
    'j-next':()=>next(),
    'j-prev':()=>{ j.qi[j.stage]>0?go(j.stage,j.qi[j.stage]-1):go(-1); },
    // Inside claude.ai the viewer confirms the save; anywhere else it's a plain file download
    'j-dl':async()=>{ let data=planPdf(), name='my-xr-distribution-plan.pdf'; if(!data){ data=new Blob([planText()],{type:'text/plain'}); name='my-xr-distribution-plan.txt'; }
      const ok=()=>{ j.saved=name.endsWith('.pdf')?'PDF downloaded':'Downloaded as text'; render(); }, dl=await dlCap;
      if(dl){ try{ await dl.save({filename:name,data}); ok(); }catch(e){} return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(data); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); ok(); },
    'j-copy':()=>{ const done2=()=>{ j.copied=true; render(); }; try{ navigator.clipboard.writeText(planText()).then(done2,()=>{}); }catch(e){} }
  });
  jEl.addEventListener('keydown',e=>{ const k=e.target.dataset&&e.target.dataset.ska; if(e.key==='Enter'&&k){ e.preventDefault(); addOwn(k); } });
  jEl.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.ska; if(k){ j.draft=j.draft||{}; j.draft[k]=e.target.value; } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&j.panel&&jEl.offsetParent){ const was=j.panel; j.panel=null; render(); refocus(`.pull-${was[0]}`); } });
  // Typing: notes and "Other" answers are saved as you type; the screen refreshes after a pause, keeping the cursor in place
  jEl.addEventListener('input',e=>{ const n=e.target.dataset.skn, o=e.target.dataset.sko, id=n||o; if(!id) return; if(n) A(n).n=e.target.value; else A(o).o=e.target.value;
    j.changed=id; const el=n?'sk-note-':'sk-o-';
    clearTimeout(jEl._t); jEl._t=setTimeout(()=>{ const ae=document.activeElement, mine=ae&&ae.id===el+id, pos=mine?ae.selectionStart:null; render(); if(mine){ const ta=document.getElementById(el+id); if(ta){ ta.focus(); ta.setSelectionRange(pos,pos); } } },700); });
  // Next fills in as soon as the screen counts as answered (design plan 2026-11-02)
  jEl.addEventListener('input',()=>{ const b=jEl.querySelector('.q-next'); if(b&&j.stage>=0&&j.stage<3) b.classList.toggle('on',done(STAGES[j.stage].qs[j.qi[j.stage]])); });
  jEl.addEventListener('toggle',e=>{ const k=e.target.dataset&&e.target.dataset.sec; if(!k) return; if(e.target.open){ j.secOpen.add(k); j.shut.delete(k); } else { j.secOpen.delete(k); j.shut.add(k); } },true);
  // Opening a folded note puts the cursor straight in it
  jEl.addEventListener('click',e=>{ const sm=e.target.closest&&e.target.closest('.note-d>summary'); if(!sm) return; const d=sm.parentElement; setTimeout(()=>{ if(d.open){ const ta=d.querySelector('textarea'); if(ta) ta.focus(); } },0); });
  // Priorities: drag and drop with a mouse; the arrow buttons do the same with a keyboard or touch
  let dragK=null;
  const rkLi=e=>e.target.closest&&e.target.closest('[data-rk]');
  const clearDrop=()=>jEl.querySelectorAll('.rk-li').forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));
  jEl.addEventListener('dragstart',e=>{ const li=rkLi(e); if(!li) return; dragK=li.dataset.rk; e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragK); }catch(_){} li.classList.add('dragging'); });
  jEl.addEventListener('dragover',e=>{ const li=rkLi(e); if(!li||!dragK) return; e.preventDefault(); const r=li.getBoundingClientRect(); clearDrop(); jEl.querySelector(`[data-rk="${dragK}"]`)?.classList.add('dragging'); if(li.dataset.rk!==dragK) li.classList.add(e.clientY>r.top+r.height/2?'drop-after':'drop-before'); });
  jEl.addEventListener('drop',e=>{ const li=rkLi(e); if(!li||!dragK) return; e.preventDefault(); const a=A('ess'), k=dragK; dragK=null; if(li.dataset.rk===k) return clearDrop();
    const o=a.order.filter(x=>x!==k), r=li.getBoundingClientRect(); let i=o.indexOf(li.dataset.rk)+(e.clientY>r.top+r.height/2?1:0); o.splice(i,0,k); a.order=o; a.set=true; j.rkMsg=`${rkL(k)}: position ${i+1} of ${o.length}`; render(); });
  jEl.addEventListener('dragend',()=>{ dragK=null; clearDrop(); });

  /* ---- Additional resources (Jacie 2026-11-02: its own tab after Database) ----
     The four case studies from the IDFA 2025 report. Each links back to the questions it informs (the kase labels in STAGES). */
  const CASES=[
    {name:'Soul Paint',who:'Sarah Ticho and Niki Smit',fmt:'VR headset, single user, 6DoF plug and play, hybrid installation',url:'https://www.soulpaint.co/',site:'soulpaint.co',
      about:'A VR experience that asks participants ‘Where are you feeling?’ and invites them to draw their emotions and embodied sensations.',
      pts:['Festivals that explicitly connect arts and health, such as More Culture, Less Medicine in Brighton and SDGs and Games at the United Nations, led to new opportunities.',
        'Festival presentations took a lot of work: some festivals said they could show XR, but much more support and training was needed.',
        'A pilot at Maidenhead Library and user-testing with an NHS trust refined the work; schools, libraries and community spaces are next.']},
    {name:'AI & Me',who:'Mots: Octavian Mot and Daniela Nedovescu',fmt:'Physical installation using screens, camera and AI system',url:'https://mots.us/work/ai-and-me',site:'mots.us',
      about:'A multi-part interactive installation that asks ‘Can AI know who you are just by looking at you?’',
      pts:['Two builds of the whole set let it ship to two places at once, and a 44-page manual and pre-production calls mean the artists no longer need to be on site.',
        'Sourcing over one hundred components locally saved neither time nor cost, so the set ships, which adds transport and customs paperwork.',
        'Direct outreach to venues rather than open calls; no unpaid exhibitions, and priority to events that cover costs and pay artist fees.']},
    {name:'Kinfolk Tech',who:'Idris Brewster',fmt:'Smartphone-based AR, site-specific, expanding into AI and other interactive work',url:'https://www.kinfolktech.org/',site:'kinfolktech.org',
      about:'A nonprofit using AR, public art and community-led design to help displaced and excluded communities tell their own stories.',
      pts:['Became its own distribution platform, and puts public, community-driven installations ahead of the festival circuit.',
        'Makes work with local community organisations, sometimes through advisory councils or fellowships, and chooses partners closely aligned with its goals.',
        'Putting work online is not enough to attract audiences: the best results come when people are guided through the experience.']},
    {name:'Ancestors',who:'Steye Hallema, The Smartphone Orchestra',fmt:'Interactive event, smartphone, presenter-led',url:'https://smartphoneorchestra.com/ancestors/',site:'smartphoneorchestra.com',
      about:'A smartphone-guided group experience that travels six generations into the future.',
      pts:['Taken to the Venice gap financing market to meet key people before its IDFA DocLab premiere; each booking led to roughly two more.',
        'A low threshold: players join by following a link on their own smartphones.',
        'Also plays company events and conferences, with a children’s version for CineKid and a French version for Geneva International Film Festival.']}
  ];
  const resEl=document.getElementById('v-res');
  if(resEl){
    const rel=c=>{ const out=[]; STAGES.forEach((st,si)=>st.qs.forEach((q,qi)=>{ if(q.kase&&q.kase.startsWith(c.name+':')) out.push({q,si,qi,why:q.kase.slice(c.name.length+1).trim()}); })); return out; };
    resEl.innerHTML=`<div class="res-in"><h2 class="res-h">Additional resources</h2><p class="res-src">Case studies from the IDFA 2025 XR distribution report</p>${CASES.map(c=>{ const r=rel(c);
      return `<article class="res-case"><div class="res-meta"><h3>${esc(c.name)}</h3><p>${esc(c.who)}</p><p class="res-fmt">${esc(c.fmt)}</p><a href="${c.url}" target="_blank" rel="noopener">${esc(c.site)} ↗</a></div>
        <div class="res-body"><p class="res-about">${esc(c.about)}</p><ul class="res-pts">${c.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${r.length?`<div class="res-rel"><small>Related questions</small>${r.map(x=>`<button data-sk="res-q" data-s="${x.si}" data-i="${x.qi}"><b>${esc(x.q.short)}</b> · ${SEC[x.si].label} <span>${esc(x.why)}</span> →</button>`).join('')}</div>`:''}</div></article>`; }).join('')}</div>`;
  }
  bridge.goQ=(s,i)=>go(s,i);
  jEl.classList.add('live-sk'); jEl.setAttribute('role','group');
  // Opens with the example project filled in, so the finished plan can be seen straight away
  loadEx(); render();
}

/* ================= APP SHELL ================= */
/* Landing page with two ways in; the distribution plan and the database are tabs you can switch between at any time.
   Both keep their state for the session, so switching never loses answers. */
{
  const views={home:document.getElementById('v-home'),journey:jEl,database:pwEl,resources:document.getElementById('v-res')};
  const tabs=[...document.querySelectorAll('[data-app-tab]')];
  // The landing has no tabs: one screen with the headline and the two ways in, on the dark starry sky
  const bar=document.querySelector('.app-tabs'), foot=document.getElementById('app-foot'), lay=document.getElementById('lay');
  const show=(v,focus)=>{ Object.entries(views).forEach(([k,el])=>{ if(el) el.hidden=k!==v; });
    if(bar) bar.hidden=v==='home'; if(foot) foot.hidden=v==='home'; if(lay) lay.hidden=v!=='journey';
    document.body.classList.toggle('on-home',v==='home');
    tabs.forEach(b=>{ const on=b.dataset.appTab===v; b.setAttribute('aria-selected',on); b.tabIndex=on||v==='home'&&b.dataset.appTab==='journey'?0:-1; });
    rerenderAll(); window.scrollTo(0,0);
    try{ history.replaceState(null,'','#'+v); }catch(e){}
    if(focus){ const t=tabs.find(b=>b.dataset.appTab===v); if(t) t.focus(); } };
  // "Create Distribution Plan" opens the choice of journeys; the tab keeps wherever the person was
  // A related question in Additional resources opens that question in the distribution plan
  handlers['res-q']=t=>{ if(bridge.goQ) bridge.goQ(+t.dataset.s,+t.dataset.i); show('journey'); };
  handlers['app']=t=>{ if(t.dataset.example) bridge.loadExample(); if(t.dataset.choose&&bridge.choose) bridge.choose(); show(t.dataset.go); };
  document.addEventListener('keydown',e=>{ const t=e.target.closest&&e.target.closest('[data-app-tab]'); if(!t||!['ArrowLeft','ArrowRight'].includes(e.key)) return;
    const i=tabs.indexOf(t), n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length]; show(n.dataset.appTab,true); });
  const h=(location.hash||'').slice(1); show(views[h]?h:'home');
}
// Side panels on narrow screens: the left panel folds away below 1100px, the right one too below 760px; a rail reopens each as a drawer
{
  const NAMES={'sk-journey':[b=>b.classList.contains('plan')?'Contents':'Questions',null],'sk-pathway':[null,()=>'Matching venues']}; // the Database has no left panel (Jacie 2026-11-03)
  const rail=(side,label,open)=>`<button class="rz-rail ${side}" data-rz="${side}" aria-expanded="${open}" title="${open?'Hide':'Show'} ${label}"><span class="rz-arr" aria-hidden="true">${(side==='l')===open?'‹':'›'}</span><span class="rz-lbl">${label}</span></button>`;
  const fit=root=>{ const b=root.querySelector(':scope>.sk-body'); if(!b||b.classList.contains('sk-full')||b.children.length<2||b.querySelector(':scope>.rz-rail')) return;
    const [ln,rn]=NAMES[root.id], R3=rn&&b.children.length>(ln?2:1), n=R3&&b.children[ln?2:1].querySelector('.live-n'); b.classList.add('rz'); b.classList.toggle('norr',!R3); b.classList.toggle('nol',!ln);
    b.insertAdjacentHTML('beforeend',(ln?rail('l',typeof ln==='function'?ln(b):ln,root.classList.contains('rz-l')):'')+(R3?rail('r',rn(b)+(n?' · '+n.textContent.trim():''),root.classList.contains('rz-r')):'')); };
  Object.keys(NAMES).forEach(id=>{ const root=document.getElementById(id); if(!root) return;
    new MutationObserver(()=>fit(root)).observe(root,{childList:true}); fit(root);
    root.addEventListener('click',e=>{ const r=e.target.closest('[data-rz]');
      if(r){ const c='rz-'+r.dataset.rz, on=!root.classList.contains(c); root.classList.remove('rz-l','rz-r'); root.classList.toggle(c,on);
        root.querySelectorAll('.rz-rail').forEach(x=>x.remove()); fit(root); return; }
      // Picking a question in the open drawer closes it so the answer area is in view
      if(root.classList.contains('rz-l')&&e.target.closest('.sk-body>div:first-child [data-sk]')&&matchMedia('(max-width:1100px)').matches) root.classList.remove('rz-l'); },true);
    root.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(root.classList.contains('rz-l')||root.classList.contains('rz-r'))){ root.classList.remove('rz-l','rz-r'); root.querySelectorAll('.rz-rail').forEach(x=>x.remove()); fit(root); } });
  });
}

/* ================= shared events ================= */
document.addEventListener('click', e => {
  const t=e.target.closest('[data-sk]'); if(!t) return;
  const k=t.dataset.sk;
  if(k==='star'){ const id=t.dataset.id; stars.has(id)?stars.delete(id):stars.add(id); rerenderAll(); return; }
  if(handlers[k]) handlers[k](t);
});
document.addEventListener('keydown', e => {
  const n=e.target.closest && e.target.closest('.sk-node');
  if(n && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); handlers['pw-node'](n); }
});
})();
</script>
